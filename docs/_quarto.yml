# Quarto build of the IC102-D docs.
#
#   quarto preview docs          # live site at http://localhost:4200
#   quarto render docs           # site in docs/_site, with a PDF of every page
#   quarto render docs --profile pdf --to typst
#                                # the whole course as one PDF in docs/_book
#
# The sidebar follows the Course path order on the home page.

project:
  type: website
  output-dir: _site
  # quarto preview docs serves the site here (otherwise Quarto picks a random port).
  preview:
    port: 4200
    browser: false

website:
  title: "IC102-D — Working in Tiny Tapeout Repos (Digital)"
  description: "Make a digital Tiny Tapeout project from the template on your own GitHub account and keep its workflows passing."
  site-url: https://uoftasic.com/ic102-d/
  repo-url: https://github.com/uoftasic/ic102-d
  repo-subdir: docs
  repo-actions: [issue]
  search: true
  page-navigation: true
  navbar:
    left:
      - text: "← All courses"
        href: https://edu.uoftasic.com/
      - text: "Guide"
        href: guide/getting-started.md
      - text: "Labs"
        href: labs/lab-01-your-repo-from-the-template-overview.md
    right:
      - text: Course PDF
        icon: file-pdf
        href: "ic102-d-course.pdf"
      - icon: discord
        href: https://discord.gg/hrJnP5UsGz
        aria-label: Discord
      - icon: github
        href: https://github.com/uoftasic/ic102-d
        aria-label: GitHub
  sidebar:
    # From 992px up, floating sets the sidebar 1.5em in from the left edge
    # of the window, as "On this page" is from the right. Docked puts the
    # sidebar against the left edge.
    style: floating
    contents:
      - text: "Home"
        href: index.md
      - section: "1. Your repository"
        contents:
          - text: "Getting started"
            href: guide/getting-started.md
          - text: "Git in one page"
            href: guide/git-in-one-page.md
          - text: "Templates, forks and clones"
            href: guide/templates-forks-and-clones.md
          - text: "Lab 01: Your repository from the template"
            href: labs/lab-01-your-repo-from-the-template-overview.md
      - section: "2. Workflows"
        contents:
          - text: "What a cloud runner is"
            href: guide/what-a-cloud-runner-is.md
          - text: "Reading a workflow file"
            href: guide/reading-a-workflow-file.md
          - text: "The Tiny Tapeout workflows"
            href: guide/the-tiny-tapeout-workflows.md
          - text: "Lab 02: Read the red X"
            href: labs/lab-02-read-the-red-x-overview.md
      - section: "3. Your design"
        contents:
          - text: "RTL and gate-level tests"
            href: guide/rtl-and-gate-level-tests.md
          - text: "Your tools and the runner's tools"
            href: guide/your-tools-and-the-runners-tools.md
          - text: "Lab 03: Make it yours"
            href: labs/lab-03-make-it-yours-overview.md
      - section: "4. Review"
        contents:
          - text: "Pull requests and review"
            href: guide/pull-requests-and-review.md
          - text: "Branch rules"
            href: guide/branch-rules.md
          - text: "How open-source projects work"
            href: guide/how-open-source-projects-work.md
          - text: "Lab 04: A change through review"
            href: labs/lab-04-a-change-through-review-overview.md
      - section: "5. History"
        contents:
          - text: "History as evidence"
            href: guide/history-as-evidence.md
          - text: "Lab 05: Find the commit that broke it"
            href: labs/lab-05-find-the-commit-that-broke-it-overview.md
      - section: "Repo"
        contents:
          - text: "Lab packages"
            href: https://github.com/uoftasic/ic102-d/tree/main/labs
          - text: "The test job's tools"
            href: https://github.com/uoftasic/ic102-d/tree/main/labs/common/tt-tools

filters:
  - _filters/course.lua

# Collapsed answers move to the end of each page in PDFs; set this to
# "inline" to print them where they sit instead.
answers-in-pdf: end

format:
  html:
    # sidebar-width and margin-width are the widths of the sidebar and of
    # "On this page". The text column gets most of the width those two
    # leave, so it grows with the window. Quarto caps it at body-width minus
    # 3em, and body-width is set far wider than any screen. To set a
    # narrower cap, lower body-width.
    grid:
      sidebar-width: 200px
      margin-width: 200px
      body-width: 10000px
    theme:
      light: [cosmo, _light.scss]
      dark: [darkly, _dark.scss]
    css: _styles.css
    # Keeps old Docsify links (.../ic102-d/#/labs/...) working.
    include-in-header: _docsify-redirect.html
    toc: true
    toc-depth: 3
    code-copy: true
    lightbox: auto
    html-math-method:
      method: mathjax
      url: "https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml-full.js"
    # Listing html first stops Quarto adding a second "Typst" link.
    format-links:
      - html
      - format: typst
        text: PDF
        icon: file-pdf
  typst:
    papersize: us-letter
    margin:
      x: 0.9in
      y: 0.9in
    fontsize: 10.5pt
    toc: false
